name: SSH Key Setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-ssh-key:
    runs-on: ubuntu-latest
    steps:
      - name: Create SSH key if one does not exist
        shell: bash
        run: |
          set -u
          KEY_PATH="$HOME/.ssh/id_ed25519"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          if [[ -f "$KEY_PATH" ]]; then
            echo "SSH key already exists at $KEY_PATH"
          else
            ssh-keygen -t ed25519 -C "github-actions@$(hostname)" -f "$KEY_PATH" -N ""
            echo "SSH key created at $KEY_PATH"
          fi

          # Public keys are safe to display in logs; they are not secret.
          echo "Public key:"
          cat "${KEY_PATH}.pub"
